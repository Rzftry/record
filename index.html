<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekod Jualan - Nadiah Homemade</title>
<style>
  :root {
    --green: #16a34a; --green-dark: #166534; --green-light: #dcfce7;
    --red: #dc2626; --red-light: #fee2e2; --gray: #6b7280;
  }
  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body {
    margin: 0; padding: 16px;
    background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
    color: #064e3b; min-height: 100vh;
  }
  .container { max-width: 1000px; margin: 0 auto; }
  h1 { color: var(--green-dark); font-size: 1.5rem; margin: 8px 0 16px; }
  h2 { color: var(--green-dark); font-size: 1.15rem; margin: 0 0 12px; }
  .card {
    background: #fff; border-radius: 12px; padding: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px;
    border-top: 4px solid var(--green);
  }
  .grid { display: grid; gap: 12px; }
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 640px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
  label { display: block; font-size: 0.85rem; color: var(--gray); margin-bottom: 4px; font-weight: 600; }
  input, select {
    width: 100%; padding: 10px; border: 1.5px solid #d1fae5;
    border-radius: 8px; font-size: 1rem; background: #f9fefb; color: #064e3b;
  }
  input:focus, select:focus { outline: none; border-color: var(--green); }
  button {
    background: var(--green); color: white; border: none;
    padding: 12px 20px; border-radius: 8px; font-size: 1rem;
    font-weight: 600; cursor: pointer; transition: background 0.15s;
  }
  button:hover { background: var(--green-dark); }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  .preview {
    background: var(--green-light); border-radius: 8px; padding: 12px;
    margin: 12px 0; font-size: 0.9rem;
  }
  .preview-row { display: flex; justify-content: space-between; padding: 4px 0; }
  .preview-row strong { color: var(--green-dark); }
  .profit-big {
    font-size: 2rem; font-weight: 800; text-align: center;
    padding: 16px; border-radius: 10px; margin-top: 12px;
  }
  .profit-big.profit { color: var(--green); background: var(--green-light); }
  .profit-big.loss { color: var(--red); background: var(--red-light); }
  .profit { color: var(--green); }
  .loss { color: var(--red); }
  .loc-card {
    background: #f9fefb; border: 1.5px solid #d1fae5;
    border-radius: 10px; padding: 12px;
  }
  .loc-card h3 { margin: 0 0 8px; font-size: 1rem; color: var(--green-dark); }
  .loc-row { display: flex; justify-content: space-between; font-size: 0.88rem; padding: 2px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th { text-align: left; padding: 8px; background: var(--green-light); color: var(--green-dark); font-size: 0.8rem; }
  td { padding: 8px; border-bottom: 1px solid #ecfdf5; }
  .record-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px; border-radius: 8px; background: #f9fefb;
    margin-bottom: 8px; border-left: 4px solid var(--green);
  }
  .record-item .info { font-size: 0.9rem; }
  .del-btn { background: var(--red); padding: 6px 10px; font-size: 0.8rem; border-radius: 6px; }
  .del-btn:hover { background: #991b1b; }
  .empty { color: var(--gray); text-align: center; padding: 16px; font-style: italic; }
  .status { font-size: 0.75rem; color: var(--gray); text-align: right; padding: 4px 0; }
</style>
</head>
<body>
<div class="container">
  <h1>🌿 Rekod Jualan — Nadiah Homemade</h1>
  <div class="status" id="status">Menyambung ke Firebase...</div>

  <!-- FORM -->
  <div class="card">
    <h2>➕ Tambah Rekod</h2>
    <form id="recordForm">
      <div class="grid grid-2">
        <div>
          <label>Tarikh</label>
          <input type="date" id="dateInput" required>
        </div>
        <div>
          <label>Tempat</label>
          <select id="locInput" required>
            <option value="rnr">R&R — RM5.00</option>
            <option value="masjid">Masjid D'warung — RM4.50</option>
            <option value="uniten">Uniten — RM5.00</option>
          </select>
        </div>
        <div>
          <label>Hantar (unit)</label>
          <input type="number" id="deliveredInput" min="1" required value="10">
        </div>
        <div>
          <label>Jual (unit)</label>
          <input type="number" id="soldInput" min="0" required value="8">
        </div>
        <div>
          <label>Harga Kos (RM)</label>
          <input type="number" id="costInput" min="0" step="0.01" value="2" required>
        </div>
      </div>

      <div class="preview" id="preview"></div>
      <button type="submit" id="submitBtn">💾 Simpan Rekod</button>
    </form>
  </div>

  <!-- RINGKASAN HARI INI -->
  <div class="card">
    <h2>📊 Ringkasan Hari Ini</h2>
    <div id="todayStats" class="grid grid-3"></div>
    <div class="profit-big" id="todayProfit">RM 0.00</div>
    <div style="text-align:center; color:var(--gray); font-size:0.85rem; margin-top:8px;">
      Untung / Rugi Hari Ini
    </div>
  </div>

  <!-- RINGKASAN BULANAN -->
  <div class="card">
    <h2>📅 Ringkasan Bulanan</h2>
    <div id="monthlyStats" style="overflow-x:auto;"></div>
  </div>

  <!-- REKOD HARI INI -->
  <div class="card">
    <h2>📝 Rekod Hari Ini</h2>
    <div id="todayRecords"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, onSnapshot,
  query, orderBy, deleteDoc, doc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ================= CONFIG FIREBASE ANDA ================= */
const firebaseConfig = {
  
  apiKey: "AIzaSyCmqerXQXrZ2N-QaYv4IXXhS1LaXFx_-2g",
  authDomain: "nadiahhomemade.firebaseapp.com",
  projectId: "nadiahhomemade",
  storageBucket: "nadiahhomemade.firebasestorage.app",
  messagingSenderId: "136280919426",
  appId: "1:136280919426:web:f940be4772c69bed43d39b",
  measurementId: "G-N8RH3STX2T"

};
/* ======================================================== */

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const LOCATIONS = {
  rnr:    { name: "R&R",            price: 5   },
  masjid: { name: "Masjid D'warung", price: 4.5 },
  uniten: { name: "Uniten",         price: 5   }
};

const form = document.getElementById('recordForm');
const dateInput = document.getElementById('dateInput');
const locInput = document.getElementById('locInput');
const deliveredInput = document.getElementById('deliveredInput');
const soldInput = document.getElementById('soldInput');
const costInput = document.getElementById('costInput');
const previewEl = document.getElementById('preview');
const submitBtn = document.getElementById('submitBtn');
const todayStatsEl = document.getElementById('todayStats');
const todayProfitEl = document.getElementById('todayProfit');
const monthlyStatsEl = document.getElementById('monthlyStats');
const todayRecordsEl = document.getElementById('todayRecords');
const statusEl = document.getElementById('status');

let allRecords = [];
const todayStr = new Date().toISOString().slice(0,10);
dateInput.value = todayStr;

const fmt = n => 'RM ' + n.toFixed(2);
const pct = n => n.toFixed(1) + '%';

function calcRecord(r) {
  const revenue = r.sold * r.sellPrice;
  const cost = r.delivered * r.costPrice;
  return { revenue, cost, profit: revenue - cost, sedekah: r.delivered - r.sold };
}

function updatePreview() {
  const delivered = parseInt(deliveredInput.value) || 0;
  const sold = parseInt(soldInput.value) || 0;
  const cost = parseFloat(costInput.value) || 0;
  const price = LOCATIONS[locInput.value].price;

  if (delivered < 0 || sold < 0 || sold > delivered) {
    previewEl.innerHTML = '<span style="color:var(--red);">⚠️ Jual tak boleh melebihi hantar.</span>';
    return;
  }
  const revenue = sold * price;
  const totalCost = delivered * cost;
  const profit = revenue - totalCost;
  const sedekah = delivered - sold;
  previewEl.innerHTML = `
    <div class="preview-row"><span>Harga Jual</span><strong>${fmt(price)} × ${sold} = ${fmt(revenue)}</strong></div>
    <div class="preview-row"><span>Jumlah Kos</span><strong>${fmt(cost)} × ${delivered} = ${fmt(totalCost)}</strong></div>
    <div class="preview-row"><span>Sedekah</span><strong>${sedekah} unit</strong></div>
    <div class="preview-row"><span>Untung/Rugi</span>
      <strong style="color:${profit>=0?'var(--green)':'var(--red)'}">${fmt(profit)}</strong>
    </div>
  `;
}
[deliveredInput, soldInput, costInput, locInput].forEach(el =>
  el.addEventListener('input', updatePreview)
);

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const date = dateInput.value;
  const location = locInput.value;
  const delivered = parseInt(deliveredInput.value);
  const sold = parseInt(soldInput.value);
  const costPrice = parseFloat(costInput.value);

  if (!date || delivered < 1 || sold < 0 || sold > delivered) {
    alert('Sila semak nilai hantar/jual.');
    return;
  }
  const sellPrice = LOCATIONS[location].price;

  submitBtn.disabled = true;
  submitBtn.textContent = 'Menyimpan...';
  try {
    await addDoc(collection(db, 'records'), {
      date, location, delivered, sold, costPrice, sellPrice,
      createdAt: serverTimestamp()
    });
    deliveredInput.value = 10;
    soldInput.value = 8;
    updatePreview();
  } catch (err) {
    console.error(err);
    alert('Gagal simpan: ' + err.message);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = '💾 Simpan Rekod';
  }
});

const q = query(collection(db, 'records'), orderBy('date', 'desc'));
onSnapshot(q, snap => {
  statusEl.textContent = '✅ Bersambung ke Firebase';
  statusEl.style.color = 'var(--green)';
  allRecords = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  render();
}, err => {
  statusEl.textContent = '❌ Ralat: ' + err.message;
  statusEl.style.color = 'var(--red)';
  console.error(err);
  alert('Ralat baca data: ' + err.message + '\n\nKemungkinan:\n1. Firestore belum di-enable\n2. Rules tak benarkan baca');
});

function render() {
  renderToday();
  renderMonthly();
  renderTodayRecords();
}

function renderToday() {
  const today = new Date().toISOString().slice(0,10);
  const recs = allRecords.filter(r => r.date === today);
  const byLoc = {};
  Object.keys(LOCATIONS).forEach(k => byLoc[k] = { d:0, s:0, p:0 });
  let totalProfit = 0;

  recs.forEach(r => {
    const c = calcRecord(r);
    byLoc[r.location].d += r.delivered;
    byLoc[r.location].s += r.sold;
    byLoc[r.location].p += c.profit;
    totalProfit += c.profit;
  });

  todayStatsEl.innerHTML = Object.entries(LOCATIONS).map(([key, loc]) => {
    const s = byLoc[key];
    const pctSold = s.d ? (s.s / s.d * 100) : 0;
    return `
      <div class="loc-card">
        <h3>${loc.name}</h3>
        <div class="loc-row"><span>Hantar</span><strong>${s.d}</strong></div>
        <div class="loc-row"><span>Jual</span><strong>${s.s}</strong></div>
        <div class="loc-row"><span>% Jual</span><strong>${pct(pctSold)}</strong></div>
        <div class="loc-row"><span>Untung</span>
          <strong class="${s.p>=0?'profit':'loss'}">${fmt(s.p)}</strong>
        </div>
      </div>
    `;
  }).join('');

  todayProfitEl.textContent = fmt(totalProfit);
  todayProfitEl.classList.remove('profit', 'loss');
  todayProfitEl.classList.add(totalProfit >= 0 ? 'profit' : 'loss');
}

function renderMonthly() {
  const now = new Date();
  const monthStr = now.toISOString().slice(0,7);
  const recs = allRecords.filter(r => r.date.startsWith(monthStr));

  const byLoc = {};
  Object.keys(LOCATIONS).forEach(k => byLoc[k] = { d:0, s:0, p:0, rev:0, cost:0 });
  let totalD=0, totalS=0, totalP=0, totalRev=0, totalCost=0;

  recs.forEach(r => {
    const c = calcRecord(r);
    byLoc[r.location].d += r.delivered;
    byLoc[r.location].s += r.sold;
    byLoc[r.location].p += c.profit;
    byLoc[r.location].rev += c.revenue;
    byLoc[r.location].cost += c.cost;
    totalD += r.delivered;
    totalS += r.sold;
    totalP += c.profit;
    totalRev += c.revenue;
    totalCost += c.cost;
  });

  let rows = Object.entries(LOCATIONS).map(([key, loc]) => {
    const s = byLoc[key];
    const pctSold = s.d ? (s.s / s.d * 100) : 0;
    return `<tr>
      <td>${loc.name}</td>
      <td>${s.d}</td>
      <td>${s.s}</td>
      <td>${s.d - s.s}</td>
      <td>${pct(pctSold)}</td>
      <td>${fmt(s.rev)}</td>
      <td>${fmt(s.cost)}</td>
      <td class="${s.p>=0?'profit':'loss'}" style="font-weight:700;">${fmt(s.p)}</td>
    </tr>`;
  }).join('');

  const totalPct = totalD ? (totalS / totalD * 100) : 0;
  rows += `<tr style="background:var(--green-light); font-weight:700;">
    <td>JUMLAH</td>
    <td>${totalD}</td>
    <td>${totalS}</td>
    <td>${totalD - totalS}</td>
    <td>${pct(totalPct)}</td>
    <td>${fmt(totalRev)}</td>
    <td>${fmt(totalCost)}</td>
    <td class="${totalP>=0?'profit':'loss'}">${fmt(totalP)}</td>
  </tr>`;

  monthlyStatsEl.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Tempat</th><th>Hantar</th><th>Jual</th><th>Sedekah</th>
          <th>% Jual</th><th>Jualan</th><th>Kos</th><th>Untung</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function renderTodayRecords() {
  const today = new Date().toISOString().slice(0,10);
  const recs = allRecords.filter(r => r.date === today);

  if (!recs.length) {
    todayRecordsEl.innerHTML = '<div class="empty">Belum ada rekod hari ini.</div>';
    return;
  }

  todayRecordsEl.innerHTML = recs.map(r => {
    const c = calcRecord(r);
    const loc = LOCATIONS[r.location];
    return `
      <div class="record-item" style="border-left-color:${c.profit>=0?'var(--green)':'var(--red)'}">
        <div class="info">
          <strong>${loc.name}</strong><br>
          <span style="color:var(--gray); font-size:0.82rem;">
            Hantar ${r.delivered} · Jual ${r.sold} · Sedekah ${c.sedekah} ·
            <span class="${c.profit>=0?'profit':'loss'}" style="font-weight:700;">${fmt(c.profit)}</span>
          </span>
        </div>
        <button class="del-btn" data-id="${r.id}">Padam</button>
      </div>
    `;
  }).join('');

  todayRecordsEl.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Padam rekod ini?')) return;
      try {
        await deleteDoc(doc(db, 'records', btn.dataset.id));
      } catch (err) {
        alert('Gagal padam: ' + err.message);
      }
    });
  });
}

updatePreview();
</script>
</body>
</html>
